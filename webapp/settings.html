<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aura Health - Profile Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            padding-bottom: 80px;
        }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1a1a2e; }
        h1 span { color: #6c5ce7; }
        h2 { font-size: 18px; margin: 24px 0 16px 0; color: #1a1a2e; border-left: 4px solid #6c5ce7; padding-left: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #666; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 16px; font-size: 16px; background: #f8f9fa; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #6c5ce7; background: white; }
        .save-btn { width: 100%; padding: 14px; background: #6c5ce7; color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: all 0.3s; }
        .save-btn:hover { background: #5a4bcf; transform: translateY(-1px); }
        .result-card { background: #f8f9fa; border-radius: 20px; padding: 16px; margin: 20px 0; text-align: center; }
        .result-card .value { font-size: 32px; font-weight: 700; color: #6c5ce7; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 20px 24px;
            border-top: 1px solid #f0f0f0;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 30px; transition: all 0.3s ease; }
        .nav-item.active { background: rgba(108,92,231,0.1); }
        .nav-item.active .nav-icon { color: #6c5ce7; transform: translateY(-2px); }
        .nav-item.active .nav-label { color: #6c5ce7; font-weight: 600; }
        .nav-icon { font-size: 22px; color: #999; transition: all 0.3s ease; }
        .nav-label { font-size: 11px; color: #999; transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PROFILE <span>SETTINGS</span></h1>
        <p style="color: #666; margin-bottom: 20px;">Your Aura Health Profile</p>
        
        <h2>📋 PERSONAL DATA</h2>
        <form id="profileForm">
            <div class="form-group"><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
            <div class="form-group"><label>Age</label><input type="number" id="age" placeholder="25"></div>
            <div class="form-group"><label>Height (cm)</label><input type="number" id="height" placeholder="170"></div>
            <div class="form-group"><label>Weight (kg)</label><input type="number" id="weight" step="0.1" placeholder="70"></div>
            
            <h2>🎯 DAILY LIFE & GOALS</h2>
            <div class="form-group"><label>Lifestyle Intensity</label>
                <select id="activityLevel">
                    <option value="sedentary">Sedentary (office job)</option>
                    <option value="light">Light (1-3 workouts)</option>
                    <option value="moderate">Moderate (3-5 workouts)</option>
                    <option value="active">Active (6-7 workouts)</option>
                    <option value="very_active">Very Active (physical work)</option>
                </select>
            </div>
            <div class="form-group"><label>Primary Goal</label>
                <select id="goal">
                    <option value="lose">🏃 Lose Weight</option>
                    <option value="maintain">⚖️ Maintain Weight</option>
                    <option value="gain">💪 Gain Muscle</option>
                </select>
            </div>
            <div class="form-group"><label>Targeted Weight Change</label>
                <select id="weightChange">
                    <option value="0.5">0.5 kg per week</option>
                    <option value="1.0">1.0 kg per week</option>
                    <option value="1.5">1.5 kg per week</option>
                </select>
            </div>
            <button type="submit" class="save-btn">💾 UPDATE MY AURA</button>
        </form>
        
        <div class="result-card" id="resultCard" style="display: none;">
            <p>🔥 Your Daily Calorie Target</p>
            <div class="value" id="dailyCalories">0</div>
            <p>kcal/day</p>
            <div style="display: flex; justify-content: space-between; margin-top: 12px;">
                <span>🥩 Protein: <strong id="proteinCalc">0</strong>g</span>
                <span>🧈 Fat: <strong id="fatCalc">0</strong>g</span>
                <span>🍚 Carbs: <strong id="carbsCalc">0</strong>g</span>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item" data-nav="dashboard"><div class="nav-icon">🏠</div><div class="nav-label">Dashboard</div></div>
        <div class="nav-item" data-nav="stats"><div class="nav-icon">📅</div><div class="nav-label">Reports</div></div>
        <div class="nav-item" data-nav="mealplans"><div class="nav-icon">📋</div><div class="nav-label">Meal Plans</div></div>
        <div class="nav-item active" data-nav="profile"><div class="nav-icon">👤</div><div class="nav-label">Profile</div></div>
    </div>

    <script>
        const telegramId = new URLSearchParams(window.location.search).get('user_id');
        
        function calculateTDEE() {
            const age = parseInt(document.getElementById('age').value) || 25;
            const gender = document.getElementById('gender').value;
            const height = parseInt(document.getElementById('height').value) || 170;
            const weight = parseFloat(document.getElementById('weight').value) || 70;
            const activity = document.getElementById('activityLevel').value;
            const goal = document.getElementById('goal').value;
            
            let bmr = gender === 'male' ? 10 * weight + 6.25 * height - 5 * age + 5 : 10 * weight + 6.25 * height - 5 * age - 161;
            const activityMap = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9 };
            let tdee = bmr * (activityMap[activity] || 1.55);
            if (goal === 'lose') tdee *= 0.85;
            else if (goal === 'gain') tdee *= 1.15;
            
            let protein = goal === 'gain' ? Math.round(weight * 2.0) : (goal === 'lose' ? Math.round(weight * 2.2) : Math.round(weight * 1.8));
            let fat = Math.round((tdee * 0.28) / 9);
            let carbs = Math.round((tdee - (protein * 4) - (fat * 9)) / 4);
            
            return { calories: Math.round(tdee), protein, fat, carbs };
        }
        
        function updateCalculator() {
            const result = calculateTDEE();
            document.getElementById('dailyCalories').innerText = result.calories;
            document.getElementById('proteinCalc').innerText = result.protein;
            document.getElementById('fatCalc').innerText = result.fat;
            document.getElementById('carbsCalc').innerText = result.carbs;
            document.getElementById('resultCard').style.display = 'block';
        }
        
        document.getElementById('profileForm').addEventListener('input', updateCalculator);
        
        async function loadProfile() {
            if (!telegramId) return;
            try {
                const response = await fetch(`/api/user/${telegramId}`);
                const data = await response.json();
                if (!data.error) {
                    document.getElementById('gender').value = data.gender || 'male';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('height').value = data.height || '';
                    document.getElementById('weight').value = data.weight || '';
                    document.getElementById('activityLevel').value = data.activity_level || 'moderate';
                    document.getElementById('goal').value = data.goal || 'maintain';
                    updateCalculator();
                }
            } catch(e) { console.error(e); }
        }
        
        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const result = calculateTDEE();
            const profile = {
                first_name: "User",
                age: parseInt(document.getElementById('age').value) || 0,
                gender: document.getElementById('gender').value,
                height: parseInt(document.getElementById('height').value) || 0,
                weight: parseFloat(document.getElementById('weight').value) || 0,
                activity_level: document.getElementById('activityLevel').value,
                goal: document.getElementById('goal').value,
                daily_calorie_goal: result.calories,
                protein_goal: result.protein,
                fat_goal: result.fat,
                carbs_goal: result.carbs
            };
            try {
                const response = await fetch(`/api/user/${telegramId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profile)
                });
                if (response.ok) {
                    alert(`✅ Profile updated! Target: ${result.calories} kcal/day`);
                    window.location.href = `/?user_id=${telegramId}`;
                } else alert('❌ Save failed');
            } catch(e) { alert('❌ Network error'); }
        };
        
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const navName = item.dataset.nav;
                    if (navName === 'dashboard') window.location.href = `/?user_id=${telegramId}`;
                    else if (navName === 'stats') window.location.href = `/?user_id=${telegramId}&tab=stats`;
                    else if (navName === 'mealplans') window.location.href = `/?user_id=${telegramId}&tab=plans`;
                    else if (navName === 'profile') window.location.href = `/settings?user_id=${telegramId}`;
                });
            });
        }
        
        loadProfile();
        setupNavigation();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Налаштування - Aura Health</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1a1a2e; }
        h2 { font-size: 18px; margin: 24px 0 16px 0; color: #1a1a2e; border-left: 4px solid #6c5ce7; padding-left: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #666; }
        .form-group input, .form-group select {
            width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 16px; font-size: 16px;
        }
        .save-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 16px;
        }
        .back-btn { background: #666; margin-top: 16px; }
        .info-box {
            background: #e3f2fd; border-radius: 20px; padding: 16px; margin: 16px 0;
            border-left: 4px solid #2196f3;
        }
        .info-box p { font-size: 14px; color: #1976d2; }
        button { cursor: pointer; transition: all 0.3s ease; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Налаштування</h1>
        <p style="color: #666; margin-bottom: 20px;">Керуйте профілем та параметрами</p>
        
        <h2>👤 Мій профіль</h2>
        <form id="profileForm">
            <div class="form-group">
                <label>Ім'я</label>
                <input type="text" id="firstName" placeholder="Ваше ім'я">
            </div>
            <div class="form-group">
                <label>Вік (років)</label>
                <input type="number" id="age" placeholder="25">
            </div>
            <div class="form-group">
                <label>Стать</label>
                <select id="gender">
                    <option value="male">Чоловік</option>
                    <option value="female">Жінка</option>
                </select>
            </div>
            <div class="form-group">
                <label>Зріст (см)</label>
                <input type="number" id="height" placeholder="170">
            </div>
            <div class="form-group">
                <label>Вага (кг)</label>
                <input type="number" id="weight" step="0.1" placeholder="70">
            </div>
            <div class="form-group">
                <label>Рівень активності</label>
                <select id="activityLevel">
                    <option value="sedentary">Сидячий (офісна робота)</option>
                    <option value="light">Легкий (1-3 тренування)</option>
                    <option value="moderate">Помірний (3-5 тренувань)</option>
                    <option value="active">Високий (6-7 тренувань)</option>
                    <option value="very_active">Дуже високий (фізична робота)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Моя ціль</label>
                <select id="goal">
                    <option value="lose">🏃 Схуднення</option>
                    <option value="maintain">⚖️ Підтримка ваги</option>
                    <option value="gain">💪 Набір м'язової маси</option>
                </select>
            </div>
            <button type="submit" class="save-btn">💾 Зберегти зміни</button>
        </form>
        
        <div class="info-box">
            <p>🤖 <strong>Gemini AI</strong> — аналізує ваші фото їжі, визначає калорії та БЖУ</p>
        </div>
        
        <button class="back-btn save-btn" onclick="goBack()">← На головну</button>
    </div>
    
    <script>
        const telegramId = new URLSearchParams(window.location.search).get('user_id');
        
        async function loadProfile() {
            if (!telegramId) return;
            try {
                const response = await fetch(`/api/user/${telegramId}`);
                const data = await response.json();
                if (!data.error) {
                    document.getElementById('firstName').value = data.first_name || '';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('gender').value = data.gender || 'male';
                    document.getElementById('height').value = data.height || '';
                    document.getElementById('weight').value = data.weight || '';
                    document.getElementById('activityLevel').value = data.activity_level || 'moderate';
                    document.getElementById('goal').value = data.goal || 'maintain';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const profile = {
                first_name: document.getElementById('firstName').value,
                age: parseInt(document.getElementById('age').value) || 0,
                gender: document.getElementById('gender').value,
                height: parseInt(document.getElementById('height').value) || 0,
                weight: parseFloat(document.getElementById('weight').value) || 0,
                activity_level: document.getElementById('activityLevel').value,
                goal: document.getElementById('goal').value
            };
            
            try {
                const response = await fetch(`/api/user/${telegramId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profile)
                });
                
                if (response.ok) {
                    alert('✅ Профіль збережено!');
                } else {
                    alert('❌ Помилка збереження');
                }
            } catch (error) {
                alert('❌ Помилка мережі');
            }
        };
        
        function goBack() {
            window.location.href = `/?user_id=${telegramId}`;
        }
        
        if (telegramId) {
            loadProfile();
        }
    </script>
</body>
</html>

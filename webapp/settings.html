<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Налаштування - Aura Health</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1a1a2e; }
        h2 { font-size: 18px; margin: 24px 0 16px 0; color: #1a1a2e; border-left: 4px solid #6c5ce7; padding-left: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #666; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 16px; font-size: 16px; }
        .save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6c5ce7, #a855f7); color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .result-card { background: #f0f0f0; border-radius: 20px; padding: 16px; margin: 20px 0; text-align: center; }
        .result-card .value { font-size: 32px; font-weight: 700; color: #6c5ce7; }
        
        /* Нижня навігація */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px 20px;
            border-top: 1px solid #eee;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 16px; border-radius: 30px; transition: all 0.3s ease; }
        .nav-item.active { background: rgba(108,92,231,0.1); }
        .nav-item.active .nav-icon { color: #6c5ce7; transform: translateY(-2px); }
        .nav-item.active .nav-label { color: #6c5ce7; font-weight: 600; }
        .nav-icon { font-size: 22px; color: #999; transition: all 0.3s ease; }
        .nav-label { font-size: 11px; color: #999; transition: all 0.3s ease; }
        
        button { cursor: pointer; transition: all 0.3s ease; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Налаштування</h1>
        <p style="color: #666; margin-bottom: 20px;">Заповніть параметри для розрахунку норми</p>
        
        <h2>👤 Мій профіль</h2>
        <form id="profileForm">
            <div class="form-group"><label>👤 Ім'я</label><input type="text" id="firstName" placeholder="Ваше ім'я" value="Користувач"></div>
            <div class="form-group"><label>📅 Вік (років)</label><input type="number" id="age" placeholder="25"></div>
            <div class="form-group"><label>⚧ Стать</label><select id="gender"><option value="male">Чоловік</option><option value="female">Жінка</option></select></div>
            <div class="form-group"><label>📏 Зріст (см)</label><input type="number" id="height" placeholder="170"></div>
            <div class="form-group"><label>⚖️ Вага (кг)</label><input type="number" id="weight" step="0.1" placeholder="70"></div>
            <div class="form-group"><label>🏃 Рівень активності</label>
                <select id="activityLevel">
                    <option value="sedentary">Сидячий (офісна робота)</option>
                    <option value="light">Легкий (1-3 тренування)</option>
                    <option value="moderate">Помірний (3-5 тренувань)</option>
                    <option value="active">Високий (6-7 тренувань)</option>
                    <option value="very_active">Дуже високий (фізична робота)</option>
                </select>
            </div>
            <div class="form-group"><label>🎯 Моя ціль</label>
                <select id="goal">
                    <option value="lose">🏃 Схуднення</option>
                    <option value="maintain">⚖️ Підтримка ваги</option>
                    <option value="gain">💪 Набір м'язової маси</option>
                </select>
            </div>
            <button type="submit" class="save-btn">💾 Розрахувати та зберегти</button>
        </form>
        
        <div class="result-card" id="resultCard" style="display: none;">
            <p>🔥 Ваша денна норма</p>
            <div class="value" id="dailyCalories">0</div>
            <p>ккал/день</p>
            <div style="display: flex; justify-content: space-between; margin-top: 12px;">
                <span>🥩 Білки: <strong id="proteinCalc">0</strong>г</span>
                <span>🧈 Жири: <strong id="fatCalc">0</strong>г</span>
                <span>🍚 Вуглеводи: <strong id="carbsCalc">0</strong>г</span>
            </div>
        </div>
    </div>
    
    <!-- Нижня навігація -->
    <div class="bottom-nav">
        <div class="nav-item" data-nav="dashboard"><div class="nav-icon">🏠</div><div class="nav-label">Головна</div></div>
        <div class="nav-item" data-nav="stats"><div class="nav-icon">📅</div><div class="nav-label">Статистика</div></div>
        <div class="nav-item" data-nav="mealplans"><div class="nav-icon">📋</div><div class="nav-label">Плани</div></div>
        <div class="nav-item active" data-nav="profile"><div class="nav-icon">👤</div><div class="nav-label">Профіль</div></div>
    </div>

    <script>
        const telegramId = new URLSearchParams(window.location.search).get('user_id');
        
        function calculateTDEE() {
            const age = parseInt(document.getElementById('age').value) || 25;
            const gender = document.getElementById('gender').value;
            const height = parseInt(document.getElementById('height').value) || 170;
            const weight = parseFloat(document.getElementById('weight').value) || 70;
            const activity = document.getElementById('activityLevel').value;
            const goal = document.getElementById('goal').value;
            
            let bmr;
            if (gender === 'male') bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            else bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            
            const activityMap = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9 };
            let tdee = bmr * (activityMap[activity] || 1.55);
            
            if (goal === 'lose') tdee *= 0.85;
            else if (goal === 'gain') tdee *= 1.15;
            
            let protein, fat, carbs;
            if (goal === 'gain') protein = Math.round(weight * 2.0);
            else if (goal === 'lose') protein = Math.round(weight * 2.2);
            else protein = Math.round(weight * 1.8);
            
            fat = Math.round((tdee * 0.28) / 9);
            carbs = Math.round((tdee - (protein * 4) - (fat * 9)) / 4);
            
            return { calories: Math.round(tdee), protein, fat, carbs };
        }
        
        function updateCalculator() {
            const result = calculateTDEE();
            document.getElementById('dailyCalories').innerText = result.calories;
            document.getElementById('proteinCalc').innerText = result.protein;
            document.getElementById('fatCalc').innerText = result.fat;
            document.getElementById('carbsCalc').innerText = result.carbs;
            document.getElementById('resultCard').style.display = 'block';
        }
        
        document.getElementById('profileForm').addEventListener('input', updateCalculator);
        
        async function loadProfile() {
            if (!telegramId) return;
            try {
                const response = await fetch(`/api/user/${telegramId}`);
                const data = await response.json();
                if (!data.error) {
                    document.getElementById('firstName').value = data.first_name || 'Користувач';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('gender').value = data.gender || 'male';
                    document.getElementById('height').value = data.height || '';
                    document.getElementById('weight').value = data.weight || '';
                    document.getElementById('activityLevel').value = data.activity_level || 'moderate';
                    document.getElementById('goal').value = data.goal || 'maintain';
                    updateCalculator();
                }
            } catch(e) { console.error(e); }
        }
        
        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const result = calculateTDEE();
            const firstName = document.getElementById('firstName').value || 'Користувач';
            const profile = {
                first_name: firstName,
                age: parseInt(document.getElementById('age').value) || 0,
                gender: document.getElementById('gender').value,
                height: parseInt(document.getElementById('height').value) || 0,
                weight: parseFloat(document.getElementById('weight').value) || 0,
                activity_level: document.getElementById('activityLevel').value,
                goal: document.getElementById('goal').value,
                daily_calorie_goal: result.calories,
                protein_goal: result.protein,
                fat_goal: result.fat,
                carbs_goal: result.carbs
            };
            try {
                const response = await fetch(`/api/user/${telegramId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profile)
                });
                if (response.ok) {
                    alert(`✅ Профіль збережено! Норма: ${result.calories} ккал/день, 🥩${result.protein}г, 🧈${result.fat}г, 🍚${result.carbs}г`);
                    const saved = localStorage.getItem(`aura_user_${telegramId}`);
                    let userData = saved ? JSON.parse(saved) : {};
                    userData.hasProfile = true;
                    userData.firstName = firstName;
                    userData.calorieGoal = result.calories;
                    userData.proteinGoal = result.protein;
                    userData.fatGoal = result.fat;
                    userData.carbsGoal = result.carbs;
                    localStorage.setItem(`aura_user_${telegramId}`, JSON.stringify(userData));
                    window.location.href = `/?user_id=${telegramId}&name=${encodeURIComponent(firstName)}`;
                } else {
                    const error = await response.json();
                    alert('❌ Помилка збереження: ' + (error.error || 'невідома помилка'));
                }
            } catch(e) { alert('❌ Помилка мережі: ' + e.message); }
        };
        
        // Навігація
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const navName = item.dataset.nav;
                    if (navName === 'dashboard') window.location.href = `/?user_id=${telegramId}`;
                    else if (navName === 'stats') window.location.href = `/?user_id=${telegramId}&tab=stats`;
                    else if (navName === 'mealplans') window.location.href = `/?user_id=${telegramId}&tab=plans`;
                    else if (navName === 'profile') window.location.href = `/settings?user_id=${telegramId}`;
                });
            });
        }
        
        loadProfile();
        setupNavigation();
    </script>
</body>
</html>

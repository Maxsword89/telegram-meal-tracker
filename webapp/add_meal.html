
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Add Meal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #1a1a2e; }
        .camera-area {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 2px dashed #ddd;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #photoPreview {
            max-width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
            display: none;
        }
        button {
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .back-btn { background: #666; }
        .result {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 16px;
            margin-top: 20px;
            display: none;
        }
        .loading { text-align: center; padding: 20px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Add Meal</h1>
        
        <div class="camera-area" onclick="document.getElementById('photoInput').click()">
            📷 Tap to select photo
            <input type="file" id="photoInput" accept="image/*" style="display: none">
        </div>
        
        <img id="photoPreview">
        
        <button id="analyzeBtn" onclick="analyzePhoto()" disabled>🔍 Analyze with AI</button>
        <button class="back-btn" onclick="goBack()">← Back</button>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        const telegramId = new URLSearchParams(window.location.search).get('user_id');
        let currentPhoto = null;
        
        document.getElementById('photoInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            currentPhoto = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('photoPreview').src = e.target.result;
                document.getElementById('photoPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
            document.getElementById('analyzeBtn').disabled = false;
        };
        
        async function analyzePhoto() {
            if (!currentPhoto) return;
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing with AI...</div>';
            document.getElementById('analyzeBtn').disabled = true;
            
            const formData = new FormData();
            formData.append('photo', currentPhoto);
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>📊 Result</h3>
                    <p><strong>🍽️ ${data.name}</strong></p>
                    <p>🔥 ${data.calories} kcal | 🥩 ${data.protein}g | 🧈 ${data.fat}g | 🍚 ${data.carbs}g</p>
                    <p>💡 ${data.feedback}</p>
                    <button onclick="saveMeal(${JSON.stringify(data).replace(/"/g, '&quot;')})">✅ Save Meal</button>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
                document.getElementById('analyzeBtn').disabled = false;
            }
        }
        
        async function saveMeal(meal) {
            const mealData = {
                telegram_id: parseInt(telegramId),
                name: meal.name,
                calories: meal.calories,
                protein: meal.protein,
                fat: meal.fat,
                carbs: meal.carbs,
                feedback: meal.feedback
            };
            
            const response = await fetch('/api/meals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(mealData)
            });
            
            if (response.ok) {
                alert('✅ Meal saved!');
                window.location.href = `/?user_id=${telegramId}`;
            } else {
                alert('❌ Save failed');
            }
        }
        
        function goBack() {
            window.location.href = `/?user_id=${telegramId}`;
        }
    </script>
</body>
</html>
